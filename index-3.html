<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCI — CreActivity</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=DM+Sans&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body {
  font-family: 'DM Sans', sans-serif;
  margin:0;
  background:#F8F6F1;
}

.container {
  max-width:800px;
  margin:auto;
  padding:40px 20px;
}

button {
  padding:12px 20px;
  cursor:pointer;
  margin-top:20px;
}

#results {
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <h1>Creativity Conditions Inventory</h1>

  <div id="start">
    <p>This is a simplified GitHub launch version.</p>
    <button onclick="start()">Start</button>
  </div>

  <div id="questions" style="display:none;">
    <p>Q1: I feel creative when I have freedom</p>
    <button onclick="answer(1)">Agree</button>
    <button onclick="answer(0)">Disagree</button>
  </div>

  <div id="results">
    <div class="results-wrap">
      <h2>Your Result</h2>
      <p id="resultText"></p>
    </div>

    <button onclick="downloadPDF()">Download PDF</button>
  </div>

</div>

<script>
let score = 0;

function start(){
  document.getElementById('start').style.display='none';
  document.getElementById('questions').style.display='block';
}

function answer(val){
  score += val;
  showResults();
}

function showResults(){
  document.getElementById('questions').style.display='none';
  document.getElementById('results').style.display='block';

  document.getElementById('resultText').innerText =
    score ? "You lean toward open creative conditions." : "You lean toward structured creative conditions.";
}

async function downloadPDF() {
  const element = document.querySelector('.results-wrap');

  const opt = {
    margin: 10,
    filename: 'CCI-Results.pdf',
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  };

  await html2pdf().set(opt).from(element).save();
}
</script>

</body>
</html>
